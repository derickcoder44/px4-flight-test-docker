name: Flight Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          repository: derickcoder44/px4-flight-test-docker
          submodules: recursive

      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/derickcoder44/px4-flight-test-docker
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: flight-test:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: run flight test
        run: |
          mkdir -p outputs
          docker run --rm \
            -v $(pwd)/outputs:/root/logs \
            flight-test:local \
            /root/scripts/run_flight_test.sh

      - name: push Docker image
        if: success()
        run: |
          docker tag flight-test:local ghcr.io/derickcoder44/px4-flight-test-docker:${{ github.ref_name }}
          docker push ghcr.io/derickcoder44/px4-flight-test-docker:${{ github.ref_name }}
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            docker tag flight-test:local ghcr.io/derickcoder44/px4-flight-test-docker:latest
            docker push ghcr.io/derickcoder44/px4-flight-test-docker:latest
          fi

      - name: upload logs and video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flight-test-logs
          path: outputs/
          retention-days: 5
